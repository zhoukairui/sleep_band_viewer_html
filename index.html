<script>
// ==================== 全局常量 ====================
const EEG_FS = 250, OTHER_FS = 100, SHOW_SECONDS = 10;
const EEG_POINTS = EEG_FS * SHOW_SECONDS;
const OTHER_POINTS = OTHER_FS * SHOW_SECONDS;
const VREF = 4.5, GAIN = 6;
const LSB = (2 * VREF / GAIN) / (2 ** 24);
const START_CMD = new Uint8Array([0xAA,0xAA,0x03,0x11,0x00,0x00,0x00]);
const STOP_CMD = new Uint8Array([0xAA,0xAA,0x03,0x12,0x00,0x00,0x00]);
const RANGE_VALUES = [10,50,100,200,500,1000,2000,10000];
const CANDIDATE_SVCS = [
  "000000ff-0000-1000-8000-00805f9b34fb",
  "0000ff00-0000-1000-8000-00805f9b34fb",
  "6e400001-b5b3-f393-e0a9-e50e24dcca9e"
];
const CANDIDATE_CHARS = [
  "0000ff01-0000-1000-8000-00805f9b34fb",
  "0000ee01-0000-1000-8000-00805f9b34fb",
  "6e400003-b5b3-f393-e0a9-e50e24dcca9e",
  "6e400002-b5b3-f393-e0a9-e50e24dcca9e"
];

// ==================== 工具函数 ====================
function toSigned16(v) { return v > 32767 ? v - 65536 : v; }
function toSigned24(v) { return v > 8388607 ? v - 16777216 : v; }

function bytesToHex(arr) {
  return Array.from(arr).map(x => x.toString(16).padStart(2,'0')).join('');
}

function uniqueStrings(arr) {
  const seen = new Set();
  return arr.filter(s => { const k = (s||'').trim().toLowerCase(); if(!k||seen.has(k)) return false; seen.add(k); return true; });
}

function hasProp(ch, props) { return props.some(p => ch.properties.includes(p)); }

// ==================== 前置检查 ====================
function preCheck() {
  const el = document.getElementById('preCheckTip');
  const tips = [];
  let canBLE = true;

  if (!navigator.bluetooth) {
    tips.push('浏览器不支持 Web Bluetooth，请使用 Chrome/Edge');
    canBLE = false;
  }
  if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
    tips.push('非 HTTPS 环境，需通过 HTTPS 或 localhost 访问');
  }
  if (/iPhone|iPad/i.test(navigator.userAgent)) {
    tips.push('iOS 设备：请使用 Chrome/Edge 而非 Safari，并确保已开启蓝牙权限');
  } else if (/Android/i.test(navigator.userAgent)) {
    tips.push('Android 设备：请确保已给浏览器开启位置信息和蓝牙权限');
  }

  if (tips.length === 0) {
    el.innerHTML = '环境检测通过，可以扫描设备';
    el.style.background = 'rgba(46,213,115,0.2)';
    el.style.borderLeftColor = '#2ed573';
  } else {
    el.innerHTML = tips.join('<br>');
    if (!canBLE) {
      document.querySelectorAll('.control-panel button').forEach(b => b.disabled = true);
    }
  }
}

// ==================== 页面 URL 二维码指引 ====================
function showPageUrl() {
  const qr = document.getElementById('qrArea');
  const url = window.location.href;
  if (url && !url.startsWith('file://')) {
    qr.innerHTML = `手机扫码打开此页面：<a href="${url}" target="_blank">${url}</a>`;
  } else {
    qr.textContent = '提示：通过 localhost 或 HTTPS 打开后可在此看到分享链接';
  }
}

// ==================== RingBuffer ====================
class RingBuffer {
  constructor(size) { this.data = new Float64Array(size); this.size = size; this.idx = 0; this.full = false; }
  push(v) {
    this.data[this.idx] = v;
    this.idx = (this.idx + 1) % this.size;
    if (this.idx === 0) this.full = true;
  }
  pushBatch(arr) { for (const v of arr) this.push(v); }
  toArray() {
    if (!this.full) return Array.from(this.data.slice(0, this.idx));
    return Array.from(this.data.slice(this.idx)).concat(Array.from(this.data.slice(0, this.idx)));
  }
}

// ==================== 二阶 IIR 滤波器 ====================
class DigitalFilter {
  constructor(b, a) {
    this.b = b.slice(); this.a = a.slice();
    this.xs = new Array(b.length).fill(0);
    this.ys = new Array(a.length - 1).fill(0);
  }
  process(x) {
    if (!Number.isFinite(x)) return x;
    this.xs.unshift(x); this.xs.pop();
    let y = 0;
    for (let i = 0; i < this.b.length; i++) y += this.b[i] * this.xs[i];
    for (let i = 1; i < this.a.length; i++) y -= this.a[i] * this.ys[i - 1];
    y /= this.a[0];
    this.ys.unshift(y); this.ys.pop();
    return y;
  }
}

function biquadLP(fs, fc, q) {
  q = q || Math.SQRT1_2;
  const w0 = 2 * Math.PI * fc / fs, cosw = Math.cos(w0), sinw = Math.sin(w0), a = sinw / (2 * q);
  const a0 = 1 + a, a1 = -2 * cosw, a2 = 1 - a;
  const b0 = (1 - cosw) / 2, b1 = 1 - cosw, b2 = (1 - cosw) / 2;
  return { b: [b0/a0, b1/a0, b2/a0], a: [1, a1/a0, a2/a0] };
}
function biquadHP(fs, fc, q) {
  q = q || Math.SQRT1_2;
  const w0 = 2 * Math.PI * fc / fs, cosw = Math.cos(w0), sinw = Math.sin(w0), a = sinw / (2 * q);
  const a0 = 1 + a, a1 = -2 * cosw, a2 = 1 - a;
  const b0 = (1 + cosw) / 2, b1 = -(1 + cosw), b2 = (1 + cosw) / 2;
  return { b: [b0/a0, b1/a0, b2/a0], a: [1, a1/a0, a2/a0] };
}
function biquadNotch(fs, freq, q) {
  q = q || 30;
  const w0 = 2 * Math.PI * freq / fs, cosw = Math.cos(w0), sinw = Math.sin(w0), a = sinw / (2 * q);
  const a0 = 1 + a, a1 = -2 * cosw, a2 = 1 - a;
  return { b: [1/a0, a1/a0, 1/a0], a: [1, a1/a0, a2/a0] };
}

// ==================== 数据解析 ====================
function parseEegSinglePacket(d) {
  const e1 = toSigned24((d[0]<<16)|(d[1]<<8)|d[2]) * LSB * 1e6;
  const e2 = toSigned24((d[3]<<16)|(d[4]<<8)|d[5]) * LSB * 1e6;
  return [e1, e2];
}
function parseEegBuffer(buf) {
  const LEN = 209, results = [];
  let cnt = 0;
  for (let i = 0; i + LEN <= buf.length; i += LEN) {
    if (buf[i] !== 0xC0) continue;
    for (let j = 0; j < 34; j++) results.push(parseEegSinglePacket(buf.slice(i+5+j*6, i+5+j*6+6)));
    cnt++;
  }
  if (cnt) buf.splice(0, cnt * LEN);
  return results;
}
function parseImuSingle(d) {
  return [
    toSigned16((d[1]<<8)|d[0]) / 16384 * 9.8,
    toSigned16((d[3]<<8)|d[2]) / 16384 * 9.8,
    toSigned16((d[5]<<8)|d[4]) / 16384 * 9.8,
    toSigned16((d[7]<<8)|d[6]) / 512,
    toSigned16((d[9]<<8)|d[8]) / 512,
    toSigned16((d[11]<<8)|d[10]) / 512,
    toSigned24((d[12]<<16)|(d[13]<<8)|d[14]),
    toSigned24((d[15]<<16)|(d[16]<<8)|d[17])
  ];
}
function parse185Buffer(buf) {
  const LEN = 185, results = [];
  let cnt = 0;
  for (let i = 0; i + LEN <= buf.length; i += LEN) {
    if (buf[i] !== 0xD0) continue;
    for (let j = 0; j < 10; j++) results.push(parseImuSingle(buf.slice(i+5+j*18, i+5+j*18+18)));
    cnt++;
  }
  if (cnt) buf.splice(0, cnt * LEN);
  return results;
}

// ==================== 状态 ====================
const S = {
  device: null, server: null, notifyCh: null, writeCh: null,
  connected: false, collecting: false,
  imuBuf: [], eegBuf: [], rawLogs: [],
  imuPkt: 0, eegPkt: 0,
  eegHp: false, eegLp: false, eegLpF: 30, eegNotch: false, notchFreq: 50,
  accHp: false, gyroHp: false, ppgHp: false, hrHp: false,
};

const filters = {};
const bufs = {
  accX: new RingBuffer(OTHER_POINTS), accY: new RingBuffer(OTHER_POINTS), accZ: new RingBuffer(OTHER_POINTS),
  gyroX: new RingBuffer(OTHER_POINTS), gyroY: new RingBuffer(OTHER_POINTS), gyroZ: new RingBuffer(OTHER_POINTS),
  ppg: new RingBuffer(OTHER_POINTS), hr: new RingBuffer(OTHER_POINTS),
  eeg1: new RingBuffer(EEG_POINTS), eeg2: new RingBuffer(EEG_POINTS)
};

function buildTime(n, fs) {
  const a = new Array(n);
  for (let i = 0; i < n; i++) a[i] = -SHOW_SECONDS + i / fs;
  return a;
}
const tOther = buildTime(OTHER_POINTS, OTHER_FS);
const tEeg = buildTime(EEG_POINTS, EEG_FS);

// ==================== IndexedDB 自动保存 ====================
const DB_NAME = 'SleepBandDB', DB_VER = 1, STORE = 'logs';
let db = null;
let autoSaveTimer = null;
const SAVE_INTERVAL = 3000; // 每 3 秒自动存一次
let unsavedCount = 0;
let savedChunks = 0; // 已保存的批次总数

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = () => {
      const s = req.result.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
      s.createIndex('ts', 'ts', { unique: false });
    };
    req.onsuccess = () => { db = req.result; resolve(); };
    req.onerror = () => reject(req.error);
  });
}

/** 把 rawLog 中尚未保存的条目写入 IndexedDB */
async function flushLogs() {
  if (!db || !rawLog.length || unsavedCount === 0) return;
  const entries = rawLog.slice(-unsavedCount);
  if (!entries.length) return;
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    const store = tx.objectStore(STORE);
    const chunk = { ts: Date.now(), lines: entries };
    store.add(chunk);
    tx.oncomplete = () => { savedChunks++; resolve(); };
    tx.onerror = () => reject(tx.error);
  });
}

function startAutoSave() {
  stopAutoSave();
  autoSaveTimer = setInterval(async () => {
    if (!rawLog.length || !unsavedCount) return;
    try { await flushLogs(); unsavedCount = 0; updateSaveStatus(); }
    catch(e) { log(`自动保存失败: ${e.message}`); }
  }, SAVE_INTERVAL);
}

function stopAutoSave() {
  if (autoSaveTimer) { clearInterval(autoSaveTimer); autoSaveTimer = null; }
}

async function flushThenStop() {
  stopAutoSave();
  if (rawLog.length && db) await flushLogs();
}

function updateSaveStatus() {
  const el = document.getElementById('saveStatus');
  if (savedChunks > 0) {
    el.style.display = 'inline';
    el.textContent = `已保存 ${savedChunks} 批`;
  } else {
    el.style.display = 'none';
  }
}

/** 从 IndexedDB 读取所有已保存的数据 */
async function loadAllSaved() {
  if (!db) return [];
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const store = tx.objectStore(STORE);
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

/** 删除 IndexedDB 中所有保存的数据 */
async function clearDB() {
  if (!db) return;
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    const store = tx.objectStore(STORE);
    store.clear();
    tx.oncomplete = () => { savedChunks = 0; updateSaveStatus(); resolve(); };
    tx.onerror = () => reject(tx.error);
  });
}

/** 导出时合并内存 + 已存数据，生成完整文件 */
async function prepareFullExport() {
  await flushThenStop();
  const chunks = await loadAllSaved();
  const savedLines = chunks.flatMap(c => c.lines || []);
  const allLines = rawLog.concat(savedLines);
  // 去重（可能有重复条目）
  const seen = new Set();
  return allLines.filter(l => { const k = l.trim(); if (!k || seen.has(k)) return false; seen.add(k); return true; });
}

/** 页面加载时检查是否有旧数据 */
async function checkSavedData() {
  if (!db) return false;
  const chunks = await loadAllSaved();
  if (!chunks.length) return false;
  const count = chunks.reduce((s, c) => s + (c.lines?.length||0), 0);
  log(`发现 ${count} 条已保存数据（共 ${chunks.length} 批），点击「导出日志」可下载`);
  return true;
}

// ==================== 图表 ====================
function makeChart(id, labels, datasets, unit) {
  return new Chart(document.getElementById(id), {
    type: 'line',
    data: { labels, datasets },
    options: {
      animation: false, responsive: true, maintainAspectRatio: false,
      normalized: true,
      interaction: { mode: 'nearest', intersect: false },
      plugins: { legend: { display: datasets.length > 1, labels: { color: '#aaa', boxWidth: 10 } } },
      elements: { point: { radius: 0 }, line: { borderWidth: 1.5, tension: 0 } },
      scales: {
        x: { type: 'linear', min: -SHOW_SECONDS, max: 0, ticks: { callback: v => v + 's', color: '#888', maxTicksLimit: 5 }, grid: { color: 'rgba(255,255,255,0.05)' } },
        y: { ticks: { color: '#888' }, grid: { color: 'rgba(255,255,255,0.05)' } }
      }
    }
  });
}

const charts = {
  eeg1: makeChart('eeg1Chart', tEeg, [{label:'Ch1',data:[],borderColor:'#f59e0b'}], 'uV'),
  eeg2: makeChart('eeg2Chart', tEeg, [{label:'Ch2',data:[],borderColor:'#06b6d4'}], 'uV'),
  ppg: makeChart('ppgChart', tOther, [{label:'PPG',data:[],borderColor:'#0ea5e9'}], ''),
  hr: makeChart('hrChart', tOther, [{label:'HR',data:[],borderColor:'#ec4899'}], ''),
  acc: makeChart('accChart', tOther, [
    {label:'X',data:[],borderColor:'#ef4444'},{label:'Y',data:[],borderColor:'#22c55e'},{label:'Z',data:[],borderColor:'#3b82f6'}
  ], ''),
  gyro: makeChart('gyroChart', tOther, [
    {label:'X',data:[],borderColor:'#f59e0b'},{label:'Y',data:[],borderColor:'#14b8a6'},{label:'Z',data:[],borderColor:'#a855f7'}
  ], '')
};

function setRange(chart, y) {
  chart.options.scales.y.min = -y; chart.options.scales.y.max = y;
  chart.update('none');
}
function makeRangeBtns(containerId, chart) {
  const root = document.getElementById(containerId);
  RANGE_VALUES.forEach(v => {
    const b = document.createElement('button');
    b.className = 'range-btn'; b.textContent = v;
    b.onclick = () => setRange(chart, v);
    root.appendChild(b);
  });
}
makeRangeBtns('eeg1RangeRow', charts.eeg1);
makeRangeBtns('eeg2RangeRow', charts.eeg2);
makeRangeBtns('ppgRangeRow', charts.ppg);
makeRangeBtns('hrRangeRow', charts.hr);

function toPoints(arr, len) {
  const n = arr.length;
  if (n === 0) return tOther.slice(0, len).map(x => ({x, y: 0}));
  const a = new Array(len);
  const start = len - n;
  for (let i = 0; i < len; i++) {
    a[i] = { x: (i < start ? tOther[0] - (start - i) / OTHER_FS : tOther[i - start]), y: i < start ? 0 : arr[i - start] };
  }
  return a;
}
function toPointsEeg(arr, len) {
  const n = arr.length;
  if (n === 0) return tEeg.slice(0, len).map(x => ({x, y: 0}));
  const a = new Array(len);
  const start = len - n;
  for (let i = 0; i < len; i++) {
    a[i] = { x: (i < start ? tEeg[0] - (start - i) / EEG_FS : tEeg[i - start]), y: i < start ? 0 : arr[i - start] };
  }
  return a;
}

let redrawPending = false;
function scheduleRedraw() {
  if (redrawPending) return;
  redrawPending = true;
  requestAnimationFrame(() => { redrawPending = false; redrawAll(); });
}
function redrawAll() {
  const o = OTHER_POINTS, e = EEG_POINTS;
  charts.acc.data.datasets[0].data = toPoints(bufs.accX.toArray(), o);
  charts.acc.data.datasets[1].data = toPoints(bufs.accY.toArray(), o);
  charts.acc.data.datasets[2].data = toPoints(bufs.accZ.toArray(), o);
  charts.gyro.data.datasets[0].data = toPoints(bufs.gyroX.toArray(), o);
  charts.gyro.data.datasets[1].data = toPoints(bufs.gyroY.toArray(), o);
  charts.gyro.data.datasets[2].data = toPoints(bufs.gyroZ.toArray(), o);
  charts.ppg.data.datasets[0].data = toPoints(bufs.ppg.toArray(), o);
  charts.hr.data.datasets[0].data = toPoints(bufs.hr.toArray(), o);
  charts.eeg1.data.datasets[0].data = toPointsEeg(bufs.eeg1.toArray(), e);
  charts.eeg2.data.datasets[0].data = toPointsEeg(bufs.eeg2.toArray(), e);
  Object.values(charts).forEach(c => c.update('none'));
}

// ==================== 滤波 ====================
function apply(arr, f) { return f ? arr.map(v => f.process(v)) : arr; }

function recreateFilters() {
  const fs = EEG_FS;
  filters.eeg1Hp = S.eegHp ? new DigitalFilter(biquadHP(fs, 0.5).b, biquadHP(fs, 0.5).a) : null;
  filters.eeg2Hp = S.eegHp ? new DigitalFilter(biquadHP(fs, 0.5).b, biquadHP(fs, 0.5).a) : null;
  filters.eeg1Lp = S.eegLp ? new DigitalFilter(biquadLP(fs, S.eegLpF).b, biquadLP(fs, S.eegLpF).a) : null;
  filters.eeg2Lp = S.eegLp ? new DigitalFilter(biquadLP(fs, S.eegLpF).b, biquadLP(fs, S.eegLpF).a) : null;
  filters.eeg1Notch = S.eegNotch ? new DigitalFilter(biquadNotch(fs, S.notchFreq).b, biquadNotch(fs, S.notchFreq).a) : null;
  filters.eeg2Notch = S.eegNotch ? new DigitalFilter(biquadNotch(fs, S.notchFreq).b, biquadNotch(fs, S.notchFreq).a) : null;

  const fo = OTHER_FS;
  filters.accXHp = S.accHp ? new DigitalFilter(biquadHP(fo, 0.5).b, biquadHP(fo, 0.5).a) : null;
  filters.accYHp = S.accHp ? new DigitalFilter(biquadHP(fo, 0.5).b, biquadHP(fo, 0.5).a) : null;
  filters.accZHp = S.accHp ? new DigitalFilter(biquadHP(fo, 0.5).b, biquadHP(fo, 0.5).a) : null;
  filters.gyroXHp = S.gyroHp ? new DigitalFilter(biquadHP(fo, 0.5).b, biquadHP(fo, 0.5).a) : null;
  filters.gyroYHp = S.gyroHp ? new DigitalFilter(biquadHP(fo, 0.5).b, biquadHP(fo, 0.5).a) : null;
  filters.gyroZHp = S.gyroHp ? new DigitalFilter(biquadHP(fo, 0.5).b, biquadHP(fo, 0.5).a) : null;
  filters.ppgHp = S.ppgHp ? new DigitalFilter(biquadHP(fo, 0.5).b, biquadHP(fo, 0.5).a) : null;
  filters.hrHp = S.hrHp ? new DigitalFilter(biquadHP(fo, 0.5).b, biquadHP(fo, 0.5).a) : null;
}

// ==================== 数据接收 ====================
function onImuData(rows) {
  if (!rows.length) return;
  const r = rows, n = r.length;
  let ax = new Array(n), ay = new Array(n), az = new Array(n);
  let gx = new Array(n), gy = new Array(n), gz = new Array(n);
  let ppg = new Array(n), hr = new Array(n);
  for (let i = 0; i < n; i++) {
    ax[i] = r[i][0]; ay[i] = r[i][1]; az[i] = r[i][2];
    gx[i] = r[i][3]; gy[i] = r[i][4]; gz[i] = r[i][5];
    ppg[i] = r[i][6]; hr[i] = r[i][7];
  }
  bufs.accX.pushBatch(apply(ax, filters.accXHp));
  bufs.accY.pushBatch(apply(ay, filters.accYHp));
  bufs.accZ.pushBatch(apply(az, filters.accZHp));
  bufs.gyroX.pushBatch(apply(gx, filters.gyroXHp));
  bufs.gyroY.pushBatch(apply(gy, filters.gyroYHp));
  bufs.gyroZ.pushBatch(apply(gz, filters.gyroZHp));
  bufs.ppg.pushBatch(apply(ppg, filters.ppgHp));
  bufs.hr.pushBatch(apply(hr, filters.hrHp));

  const last = r[r.length-1];
  document.getElementById('accVal').textContent = `X:${last[0].toFixed(1)} Y:${last[1].toFixed(1)} Z:${last[2].toFixed(1)}`;
  document.getElementById('gyroVal').textContent = `X:${last[3].toFixed(1)} Y:${last[4].toFixed(1)} Z:${last[5].toFixed(1)}`;
  document.getElementById('ppgVal').textContent = last[6].toFixed(0);
  document.getElementById('hrVal').textContent = last[7].toFixed(0);
  scheduleRedraw();
}

function onEegData(rows) {
  if (!rows.length) return;
  const r = rows, n = r.length;
  let e1 = new Array(n), e2 = new Array(n);
  for (let i = 0; i < n; i++) { e1[i] = r[i][0]; e2[i] = r[i][1]; }
  e1 = apply(apply(apply(e1, filters.eeg1Hp), filters.eeg1Lp), filters.eeg1Notch);
  e2 = apply(apply(apply(e2, filters.eeg2Hp), filters.eeg2Lp), filters.eeg2Notch);
  bufs.eeg1.pushBatch(e1);
  bufs.eeg2.pushBatch(e2);
  const last = r[r.length-1];
  document.getElementById('eeg1Val').textContent = last[0].toFixed(1) + ' uV';
  document.getElementById('eeg2Val').textContent = last[1].toFixed(1) + ' uV';
  scheduleRedraw();
}

// ==================== BLE ====================
function updateUI() {
  document.getElementById('connectionStatus').textContent = S.connected ? `已连接${S.device?.name||''}` : '未连接';
  document.getElementById('statusDot').className = 'status-dot' + (S.connected ? ' connected' : '');
  document.getElementById('connectBtn').disabled = !S.device || S.connected;
  document.getElementById('disconnectBtn').disabled = !S.connected;
  document.getElementById('startBtn').disabled = !S.connected || S.collecting;
  document.getElementById('stopBtn').disabled = !S.connected || !S.collecting;
}

function log(msg) {
  const t = new Date().toLocaleTimeString();
  const box = document.getElementById('logBox');
  box.value += `[${t}] ${msg}\n`;
  box.scrollTop = box.scrollHeight;
}

async function doScan(scanAll) {
  try {
    const opts = scanAll ? { acceptAllDevices: true, optionalServices: CANDIDATE_SVCS }
      : { filters: [{ namePrefix: 'CONIX' }], optionalServices: CANDIDATE_SVCS };
    const d = await navigator.bluetooth.requestDevice(opts);
    S.device = d;
    d.addEventListener('gattserverdisconnected', onDC);
    log(`找到设备: ${d.name||'未知'}`);
    updateUI();
  } catch (e) {
    let msg = '扫描失败: ';
    if (e.name === 'NotFoundError') msg += scanAll ? '未发现 BLE 设备' : '未找到 CONIX 设备，试试扫描所有设备';
    else if (e.name === 'SecurityError') msg += '请在 HTTPS 环境下使用';
    else if (e.name === 'NotAllowedError') msg += '用户取消了选择';
    else msg += e.message;
    log(msg);
  }
}

async function doConnect() {
  if (!S.device) return;
  try {
    log('连接中...');
    S.server = await S.device.gatt.connect();
    let found = false;
    for (const svcUuid of CANDIDATE_SVCS) {
      try {
        const svc = await S.server.getPrimaryService(svcUuid);
        log(`找到服务 ${svcUuid}`);
        const chars = await svc.getCharacteristics();
        for (const ch of chars) {
          const p = ch.properties;
          const propNames = [];
          if (p.notify) propNames.push('notify');
          if (p.read) propNames.push('read');
          if (p.write) propNames.push('write');
          if (p.writeWithoutResponse) propNames.push('write-without-response');
          if (p.indicate) propNames.push('indicate');
          if (p.notify && !S.notifyCh) S.notifyCh = ch;
          if ((p.write || p.writeWithoutResponse) && !S.writeCh) S.writeCh = ch;
          log(`  特征 ${ch.uuid} [${propNames.join(', ')}]`);
        }
        if (S.notifyCh || S.writeCh) { found = true; break; }
      } catch (e) { /* 跳过 */ }
    }
    if (!S.notifyCh && !S.writeCh) throw new Error('未找到可用特征');
    if (S.notifyCh) { await S.notifyCh.startNotifications(); S.notifyCh.addEventListener('characteristicvaluechanged', onData); }
    if (!S.writeCh) S.writeCh = S.notifyCh;
    S.connected = true;
    log('蓝牙连接成功');
    updateUI();
  } catch (e) {
    log(`连接失败: ${e.message}`);
  }
}

function onDC() {
  S.connected = false; S.collecting = false; S.server = null; S.notifyCh = null; S.writeCh = null;
  log('蓝牙已断开');
  updateUI();
}

async function doDisconnect() {
  if (S.device?.gatt?.connected) { S.device.gatt.disconnect(); }
  onDC();
}

async function doStart() {
  if (!S.writeCh) return;
  try {
    if (S.writeCh.writeValueWithoutResponse) await S.writeCh.writeValueWithoutResponse(START_CMD);
    else await S.writeCh.writeValue(START_CMD);
    S.collecting = true;
    startAutoSave();
    log('开始采集');
    updateUI();
  } catch(e) { log(`开始失败: ${e.message}`); }
}

async function doStop() {
  if (!S.writeCh) return;
  try {
    if (S.writeCh.writeValueWithoutResponse) await S.writeCh.writeValueWithoutResponse(STOP_CMD);
    else await S.writeCh.writeValue(STOP_CMD);
    await flushThenStop();
    S.collecting = false;
    log('停止采集');
    updateUI();
  } catch(e) { log(`停止失败: ${e.message}`); }
}

let rawLog = [];
let lastDataInfo = '';
function onData(ev) {
  const bytes = Array.from(new Uint8Array(ev.target.value.buffer));
  if (!bytes.length) return;
  rawLog.push(`${new Date().toISOString()},${bytesToHex(bytes)}`);
  unsavedCount++;

  try {
    if (bytes[0] === 0xD0) {
      S.imuBuf.push(...bytes);
      const rows = parse185Buffer(S.imuBuf);
      if (rows.length) { S.imuPkt++; onImuData(rows); }
    } else if (bytes[0] === 0xC0) {
      S.eegBuf.push(...bytes);
      const rows = parseEegBuffer(S.eegBuf);
      if (rows.length) { S.eegPkt++; onEegData(rows); }
    }
  } catch(e) { log(`解析错误: ${e.message}`); }
  lastDataInfo = `IMU:${S.imuPkt} EEG:${S.eegPkt}`;
  document.getElementById('dataInfo').childNodes[0].textContent = lastDataInfo;
}

async function doExport() {
  try {
    const lines = await prepareFullExport();
    if (!lines.length) { log('无数据可导出'); return; }
    const content = lines.join('\n');
    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `sleep_band_${new Date().toISOString().replace(/[:.]/g,'-')}.txt`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    log(`导出 ${lines.length} 条记录`);
  } catch(e) { log(`导出失败: ${e.message}`); }
}

async function clearSession() {
  if (!confirm('确定要清除所有已保存的数据吗？此操作不可恢复。')) return;
  rawLog = []; S.imuPkt = 0; S.eegPkt = 0;
  unsavedCount = 0;
  await clearDB(); stopAutoSave();
  document.getElementById('dataInfo').childNodes[0].textContent = '等待数据...';
  log('会话已清除');
}

// ==================== 滤波 UI ====================
function toggleFilter(btnId, stateKey, cb) {
  const btn = document.getElementById(btnId);
  btn.classList.toggle('active');
  S[stateKey] = btn.classList.contains('active');
  cb && cb();
  recreateFilters();
}

document.getElementById('eegHpBtn').onclick = () => toggleFilter('eegHpBtn', 'eegHp');
document.getElementById('eegLpBtn').onclick = () => {
  toggleFilter('eegLpBtn', 'eegLp');
  S.eegLpF = Number(document.getElementById('eegLpFreq').value) || 30;
};
document.getElementById('eegLpFreq').onchange = () => {
  S.eegLpF = Number(document.getElementById('eegLpFreq').value) || 30;
  if (S.eegLp) recreateFilters();
};
document.getElementById('eegNotchBtn').onclick = () => { S.notchFreq = 50; toggleFilter('eegNotchBtn', 'eegNotch'); };
document.getElementById('eegNotch60Btn').onclick = () => { S.notchFreq = 60; toggleFilter('eegNotch60Btn', 'eegNotch'); };
document.getElementById('accHpBtn').onclick = () => toggleFilter('accHpBtn', 'accHp');
document.getElementById('gyroHpBtn').onclick = () => toggleFilter('gyroHpBtn', 'gyroHp');
document.getElementById('ppgHpBtn').onclick = () => toggleFilter('ppgHpBtn', 'ppgHp');
document.getElementById('hrHpBtn').onclick = () => toggleFilter('hrHpBtn', 'hrHp');

// ==================== 初始化 ====================
document.addEventListener('DOMContentLoaded', async () => {
  preCheck();
  showPageUrl();
  recreateFilters();
  updateUI();

  try { await openDB(); log('IndexedDB 打开成功'); } catch(e) { log(`IndexedDB 打开失败: ${e.message}`); }
  try { await checkSavedData(); } catch(e) { /* 忽略 */ }

  log('页面已加载，点击扫描设备');

  document.getElementById('scanBtn').onclick = () => doScan(false);
  document.getElementById('scanAllBtn').onclick = () => doScan(true);
  document.getElementById('connectBtn').onclick = doConnect;
  document.getElementById('disconnectBtn').onclick = doDisconnect;
  document.getElementById('startBtn').onclick = doStart;
  document.getElementById('stopBtn').onclick = doStop;
  document.getElementById('exportBtn').onclick = doExport;
  document.getElementById('clearBtn').onclick = clearSession;
});
</script>
